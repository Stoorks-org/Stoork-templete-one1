<swiper [config]="config"  (swiper)="onSwiper($event)"  
 [slidesPerView]="slidesPerView" [navigation]="navigation" [scrollbar]="false"
  [pagination]="true" class="swiper" dir="ltr" [autoplay]="false">
  @for (img of SliderImge; track $index) {
  <ng-template swiperSlide>

    <img src="{{img.url}}" height="100%" width="100%" />
    <div class="heart">
      <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="currentColor" class="bi bi-heart"
        viewBox="0 0 16 16" (click)="_auth.addProductToFavorites(product)" style="cursor: pointer">
        <path
          d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143q.09.083.176.171a3 3 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15" />
      </svg>

    </div>
    <div *ngIf="fav.ProductFavorites$ | async as ProductFavorites">
      <ng-container *ngFor="let itm of ProductFavorites">
        <div class="heart active" *ngIf="itm?.product_id  == ProductId " (click)="_auth.DeleteProductFromFavorites(ProductId)">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="#D21318" class="bi bi-heart-fill"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314" />
          </svg>
         
        </div>
      </ng-container>
    </div>
  </ng-template>
  }

</swiper>
