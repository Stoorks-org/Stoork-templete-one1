<section class="home">
  <div class="hiro">
    <!-- <img src="../../../assets/images/newImges/hiro-img.png" alt="hiro-sec-img" /> -->
    <div>
       <!-- class="sliderCont container" -->
      <app-slider [SliderImge]="heroImages" ImageUrl="image_path" slider="home" dir="ltr" ></app-slider>
    </div>
  </div>
  <div class="web"> 
  <app-catogriespaginator  [categories]="categories" [isLoadingcategories]="isLoadingcategories"></app-catogriespaginator>  </div>     
  <!-- <div class="responsive">class="web"
     <app-swipper-for-category [categories]="categories"  [isLoadingcategories]="isLoadingcategories" [sliderColor]="sliderColor"></app-swipper-for-category>
  </div> -->
  <div class="responsive"> 
  <div class="swiperCats">
     <h6 style="font-weight: 650;margin-bottom: .4rem; padding: 5px;">{{ "categories" | translate }}</h6>
    <swiper
      [config]="configCats"
      [slidesPerView]="slidePerViewCats"
      [navigation]="navigationCats" class="swiper" dir="ltr" >
      
      @for (item of categories; track $index) {
      
      <ng-template swiperSlide>
      
        <div class="catParent" routerLink="/AllProduct/{{item.id}}/0">
          <blockquote class="m-0 catImg">
            @if (item.image) {
            <img src="{{item.image_url }}" alt="{{item.name}}" />
            }@else {
            <img src="/assets/images/home/placeholder.jpg" alt="{{ item.name }}" />
            }
          </blockquote>
          <blockquote class="m-0 catName">
            {{item.name.substring(0, 10) }}
          </blockquote>
        </div>
      </ng-template>}
  </swiper>
  </div>
</div>
  <!-- first products ( 10 )   -->
  <div class="firstProducts">
    <app-products  [PopularProducts]="PopularProducts" [showHead]="true" [isPopularProductsLoading]="isPopularProductsLoading"
     [showCartContainer]="true" ></app-products>
  <!-- class="web"<app-product-responsive class="responsive" [PopularProducts]="PopularProducts" [showHead]="true" [isPopularProductsLoading]="isPopularProductsLoading"></app-product-responsive> -->
  </div>
  <!-- slider  -->
  <div class="sliderCont mt-3">
    <app-slider [SliderImge]="SliderImge" ImageUrl="website_image" slider="offer" dir="ltr"></app-slider>
  </div>

  <!--other products   class="web"-->
  <div class="secProducts" *ngIf="mustSoldProduct?.length>0">
    <h4 style="font-weight: 650;" class="mt-3">{{'bestSells'|translate}}</h4>
    <app-products 
      [PopularProducts]="mustSoldProduct" [isPopularProductsLoading]="isMustSoldProductsLoading"
      [showHead]="false" [showCartContainer]="false"
    ></app-products>
     <!-- <app-product-responsive class="responsive" [PopularProducts]="mustSoldProduct" [showHead]="false" [isPopularProductsLoading]="isMustSoldProductsLoading"></app-product-responsive>-->
  </div> 

  <!-- slider  -->
</section>
