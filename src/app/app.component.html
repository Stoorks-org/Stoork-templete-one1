
<main  [ngClass]="{ 'mainSecAr':!_aut.isValueEn.value,'mainSecEn':_aut.isValueEn.value }"
  [dir]="'dir' | translate" >

  <app-header></app-header>
  <app-nav-menu></app-nav-menu>
  <section class="content">
     <section class="h-100">
   <router-outlet></router-outlet></section></section>
   <section class="login h-100" *ngIf="isCart||isLoging||isSignUp||isforgetpassword||iscreatenewpassword||isverifypassword">
        <div *ngIf="isCart">
        <app-header-cart></app-header-cart>
      </div>
    <div *ngIf="isLoging">
        <app-login></app-login>
      </div>
      <div *ngIf="isSignUp">
        <app-register></app-register>
      </div>
       <div *ngIf="isforgetpassword">
        <app-forgetpassword></app-forgetpassword>
      </div>
      <div *ngIf="iscreatenewpassword">
        <app-createnewpassword></app-createnewpassword>
      </div>
       <div *ngIf="isverifypassword">
        <app-verify-password></app-verify-password>
      </div>
    </section>
