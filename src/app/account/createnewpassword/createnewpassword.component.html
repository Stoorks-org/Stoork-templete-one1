<div class="logindialog" *ngIf="showMe">
  <div class="close" [dir]="_auth.isValueEn?'ltr':'rtl'">
    <div class="back"><i class="bi bi-chevron-left" (click)="BackBtn()"></i>{{'Back'|translate}}</div>
    <div><i class="bi bi-x-lg" (click)="closelogin()"></i></div>
  </div>
  <section class="loginsec">
    <form  *ngIf="newpassword" [formGroup]="newpassword" (ngSubmit)="onSubmit()">
      <div class="text-center mt-5">
        <h6 style="font-size: 32px">{{'createNewPassword'|translate}}</h6>

        <p style="font-size: 16px" class="mt-3">
          {{'Protectyouraccountbycreating'|translate}}<br />{{'astronguniquepasswordforaddedsecurity'|translate}}
        </p>
      </div>
      <div>
        <label for="code1" class="mt-2">{{'code'|translate}}</label>
        <input type="text" [class.is-invalid]="
            newpassword.get('code')?.invalid &&
            newpassword.get('code')?.touched
          " formControlName="code" class="form-control mt-2" id="code1" placeholder="" />
        <div *ngIf="newpassword.get('code')?.errors?.['required']" class="invalid-feedback">
          {{'codeisrequired'|translate}}
        </div>
      </div>
      <div class="field">
        <label for="floatingPassword" class="mt-3">{{'password'|translate}}</label><span *ngIf=" newpassword.get('password')?.invalid &&
        newpassword.get('password')?.touched
        ">*</span>

        <input [type]="showpassword?'text':'password'" [class.is-invalid]="
        newpassword.get('password')?.invalid &&
        newpassword.get('password')?.touched
        " formControlName="password" class="form-control mt-2" id="floatingPassword" placeholder=""
          (keyup)="showPassStr=true" />

        <i (click)="toggleShow()" class="bi bi-eye" *ngIf="!showpassword"  [ngClass]="{ 'eye':_auth.isValueEn.value,'eyeAr':!_auth.isValueEn.value  }"></i>
        <i (click)="toggleShow()" class="bi bi-eye-slash" *ngIf="showpassword"  [ngClass]="{ 'eye':_auth.isValueEn.value,'eyeAr':!_auth.isValueEn.value  }"></i>
        <div *ngIf="newpassword.get('password')?.errors?.['required']" class="invalid-feedback f">
          {{'passwordisrequired'|translate}}
        </div>
      </div>
      <app-password-str [passwordToCheck]="newpassword.value.password" *ngIf="showPassStr"></app-password-str>

      <!-- <label for="pass1" class="mt-3">New Password</label>
      <div>
        <p-password inputId="pass1" formControlName="password" [toggleMask]="true" [feedback]="true" [class.is-invalid]="
            newpassword.get('password')?.invalid &&
            newpassword.get('password')?.touched
          "></p-password>
      </div>
      <div *ngIf="newpassword.get('password')?.errors?.['required']" class="invalid-feedback">
        password is required
      </div> 
      <div *ngIf="newpassword.get('password')?.errors?.['pattern']" class="invalid-feedback">
        The password field must be at least 8 characters. The password field
        must contain at least one letter. The password field must contain at
        least one symbol."
      </div>-->
      <label for="confirm_password" class="mt-3">{{'confirmPassword'|translate}}</label>
      <div class="field">
        <input [type]="showpassword1?'text':'password'" [class.is-invalid]="
        newpassword.get('confirm_password')?.invalid &&
        newpassword.get('confirm_password')?.touched
        " formControlName="confirm_password" class="form-control mt-2" id="confirm_password" placeholder="" />

        <i (click)="toggleShow1()" class="bi bi-eye eye" *ngIf="!showpassword1"></i>
        <i (click)="toggleShow1()" class="bi bi-eye-slash eye" *ngIf="showpassword1"></i>
        <!-- <div *ngIf="newpassword.get('confirm_password')?.errors?.['required']" class="invalid-feedback f">
          password is required
        </div> -->
        <!-- <div *ngIf="newpassword.errors?.['passwordMismatcgError'] && newpassword.get('confirm_password')?.touched"
          class="invalid-feedback f">
        
          {{'Passwordmismatched'|translate}}
        </div> -->
        <!-- <div *ngIf="passwordMismatch" class="invalid-feedback f">
  {{ 'Passwordmismatched' | translate }}
</div> -->
      </div>

      <!-- <p-password formControlName="confirm_password" [toggleMask]="true" [feedback]="true" [class.is-invalid]="
            newpassword.get('confirm_password')?.invalid &&
            newpassword.get('confirm_password')?.touched
          "></p-password>
      </div>
      <div *ngIf="newpassword.get('confirm_password')?.errors?.['required']" class="invalid-feedback">
        password is required
      </div>
      <div *ngIf="newpassword.get('confirm_password')?.errors?.['pattern']" class="invalid-feedback">
        The password field must be at least 8 characters. The password field
        must contain at least one letter. The password field must contain at
        least one symbol."
      </div>[disabled]="newpassword.invalid"-->

      <div class="text-center mt-4">
        <button class="btn-orangeLarge" [disabled]="newpassword.invalid"  type="submit" style="margin-bottom :50px;">
          {{'Signin'|translate}}
        </button>
      </div>
    </form>
  </section>
  <p-toast></p-toast>
</div>
