
<div class="logindialog" *ngIf="showMe">
  <div class="close"><i class="bi bi-x-lg" (click)="closelogin()"></i></div>
  <section class="loginsec">
    <form *ngIf="loginForm" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="text-center mt-5">
        <h5>{{'SignInToYourAccount'|translate}}</h5>
      </div>
      <label for="floatingEmail" class="mt-3">{{'email'|translate}}</label><span
        *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">*</span>
      <input type="email" [class.is-invalid]="
          loginForm.get('email')?.invalid && loginForm.get('email')?.touched
        " formControlName="email" class="form-control mt-2" id="floatingEmail" placeholder="" />

      <div *ngIf="loginForm.get('email')?.errors?.['required']" class="invalid-feedback">
        {{'Emailisrequired'|translate}}
      </div>
      <div class="field">
        <label for="floatingPassword" class="mt-3">{{'password'|translate}}</label><span
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">*</span>
        <input [type]="showpassword?'text':'password'" [class.is-invalid]="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched" formControlName="password" class="form-control  mt-2"
          id="floatingPassword" placeholder="" />
        <i (click)="toggleShow()" class="bi bi-eye" *ngIf="!showpassword" [ngClass]="{ 'eye':_auth.isValueEn.value,'eyeAr':!_auth.isValueEn.value  }" ></i>
        <i (click)="toggleShow()" class="bi bi-eye-slash" *ngIf="showpassword" [ngClass]="{ 'eye':_auth.isValueEn.value,'eyeAr':!_auth.isValueEn.value  }"></i>
        <div *ngIf="loginForm.get('password')?.errors?.['required']" class="invalid-feedback f">
          {{'passwordisrequired'|translate}}
        </div>
      </div>
      <div class="text-center mt-4">
        <a style="color: #2b2b8d" (click)="openforgetpassword()">{{'Forgotyourpassword'|translate}}</a>
      </div>
      <div class="text-center mt-4">
        <button class="btn-orangeLarge" [disabled]="loginForm.invalid" type="submit">
          {{'SIGNIN'|translate}}
        </button>
      </div>
      <div class="text-center mt-4" style="margin-bottom: 50px;">
        <label>{{'dontHaveAnAccount'|translate}}</label>
        <a style="color: #fa652e" (click)="OpenSignUp()">{{'signUp'|translate}}</a>
      </div>
    </form>
  </section>

  <p-toast></p-toast>
  <!-- <button
      type="button"
      pButton
      pRipple
      (click)="showError()"
      label="Error"
      class="p-button-danger"
    ></button> -->
</div>
