<div class="logindialog" *ngIf="showRegister">
  <div class="close"><i class="bi bi-x-lg" (click)="closelogin()"></i></div>
  <section class="loginsec">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmitregister()">
      <div class="text-center mt-5">
        <h5>{{'createAnAccount'|translate}}</h5>
      </div>

      <div>
        <label for="floatingtName" class="mt-2">{{'fullName'|translate}}</label><span *ngIf="
            registerForm.get('name')?.invalid &&
            registerForm.get('name')?.touched
          ">*</span>
        <input type="text" [class.is-invalid]="
            registerForm.get('name')?.invalid &&
            registerForm.get('name')?.touched
          " formControlName="name" class="form-control mt-2" id="floatingtName" placeholder="" />
        <div *ngIf="registerForm.get('name')?.errors?.['required']" class="invalid-feedback">
          {{'nameisrequired'|translate}}
        </div>
      </div>
      <label class="mt-3">{{'email'|translate}}</label><span *ngIf="
          registerForm.get('email')?.invalid &&
          registerForm.get('email')?.touched
        ">*</span>
      <input type="email" [class.is-invalid]="
          registerForm.get('email')?.invalid &&
          registerForm.get('email')?.touched
        " formControlName="email" class="form-control mt-2" id="floatingEmail" placeholder="" />

      <div *ngIf="registerForm.get('email')?.errors?.['required']" class="invalid-feedback">
        {{'Emailisrequired'|translate}}
      </div>
      <div *ngIf="registerForm.get('email')?.errors?.['email']" class="invalid-feedback">
        {{'thisisnotEmailformat'|translate}}
      </div>
      <div class="field">
        <label for="floatingPassword" class="mt-3">{{'password'|translate}}</label>
        <span *ngIf="
            registerForm.get('password')?.invalid &&
            registerForm.get('password')?.touched
          ">*</span>
        <input [type]="showpassword ? 'text' : 'password'" [class.is-invalid]="
            registerForm.get('password')?.invalid &&
            registerForm.get('password')?.touched
          " formControlName="password" class="form-control mt-2" id="floatingPassword" placeholder=""
          (keyup)="showPassStr = true" (input)="onInputChange($event)" />

        <i (click)="toggleShow()" class="bi bi-eye" *ngIf="!showpassword" [ngClass]="{ 'eye':_auth.isValueEn.value,'eyeAr':!_auth.isValueEn.value  }"></i>
        <i (click)="toggleShow()" class="bi bi-eye-slash" *ngIf="showpassword" [ngClass]="{ 'eye':_auth.isValueEn.value,'eyeAr':!_auth.isValueEn.value  }"></i>
      </div>

      <div *ngIf="registerForm.get('password')?.errors?.['required']" class="invalid-feedback f1">
        {{'passwordisrequired'|translate}}
      </div>
      <!-- <div
        *ngIf="registerForm.get('password')?.errors?.['pattern']"
        class="invalid-feedback f"
      >
        at least 8 characters,must contain at least one letter,one symbol.
      </div> -->

      <app-password-str [passwordToCheck]="registerForm.value.password" class="passStr"
        *ngIf="showPassStr" [dir]="_auth.isValueEn?'ltr':'rtl'"></app-password-str>

      <div class="text-center mt-5">
        <button class="btn-orangeLarge" [disabled]="registerForm.invalid" type="submit">
          {{'createAnAccountCapital'|translate}}
        </button>
      </div>
      <div class="text-center mt-4" style="margin-bottom: 50px">
        <label>{{'alreadyHaveAnAccount'|translate}}</label>
        <a class="text-center mt-4" (click)="OpenSignIn()" style="color: #fa652e">
          {{'login'|translate}}
        </a>
      </div>
    </form>
  </section>
</div>
<p-toast></p-toast>
