<div>
   
    <div class="cart" *ngIf="showMe">

        <div class="txtcart text-center">{{'cart'|translate}}</div>
        <div class="close"><i class="bi bi-x-lg" (click)="CloseCart()"></i></div>
        <div class="columncart">
        <section class="ProSec">
            <div class="pro" *ngFor="let pro of cart">
                
                        <!-- <img [src]="auth.productImage(pro?.product?.images)"> -->
                         <img src="{{pro?.imageUrl}}">
                         
                <div class="det">
                    <div>{{pro?.proName|slice:0:15}}</div>
                    <div class="txt">{{'price'|translate}} <span class="price">:
                         <!-- {{ getProductPriceWithOption(pro)| currency : "ILS"}}  -->
                      {{pro?.price}}
                    </span></div>
                     <div *ngFor="let option of pro?.options" class="txt">
                       <div>{{option.name }}:{{option.value}}</div></div>
                   
                    <div class="AddtoCart">
                        <!-- <span>{{'addedToCart'|translate}} <i
                                class="bi bi-check-circle-fill"></i></span> -->
                        <span>{{'itemsCount'|translate}}({{pro.count}})</span>
                    </div>
                   
                </div>
            </div>
            <div class="total">
            <div>{{'cartTotal'|translate}}</div>
            <div class="cartTotal">{{totalCartPrice}}{{currency}}</div>
            </div>
        </section>
        <div style="width: 100%;" class="buttonCart"><button class="btn btn-white" routerLink="/home"
                (click)="CloseCart()">{{'continueShopping'|translate}}</button>
        <button class="btn-orangeLarge" routerLink="cart" (click)="CloseCart()">{{'Confirm'|translate}}</button>
    </div></div></div>
